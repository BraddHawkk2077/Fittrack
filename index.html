<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FitTrack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #14171A; color: #EDEBE6; }
    .container { max-width: 480px; margin: 0 auto; padding: 20px; }
    .header { padding: 20px 0 14px; border-bottom: 1px solid #31363B; margin-bottom: 20px; }
    .header h1 { font-size: 26px; margin: 0 0 5px; color: #EDEBE6; }
    .header p { font-size: 12px; color: #8A9199; letter-spacing: 2px; }
    .card { background: #1D2125; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .card h2 { font-size: 18px; margin-bottom: 10px; color: #7CB342; }
    .exercise { padding: 12px 0; border-top: 1px solid #31363B; }
    .exercise:first-child { border-top: none; }
    .exercise-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .exercise-desc { font-size: 12px; color: #8A9199; }
    button { background: #7CB342; color: #12160F; border: none; border-radius: 12px; padding: 12px 20px; font-weight: 700; cursor: pointer; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1D2125; border-top: 1px solid #31363B; padding: 10px 0 20px; }
    nav div { max-width: 480px; margin: 0 auto; display: flex; justify-content: space-around; }
    nav button { background: none; color: #8A9199; font-size: 11px; padding: 8px 12px; text-align: center; }
    nav button.active { color: #7CB342; }
    .content { padding-bottom: 80px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <p>RUTINA</p>
    <h1>🏋️ FitTrack</h1>
  </div>
  
  <div id="app">
    <div class="card">
      <h2>Hombros</h2>
      <div class="exercise">
        <div class="exercise-name">Press militar con barra</div>
        <div class="exercise-desc">4 series x 8-10 reps</div>
      </div>
      <div class="exercise">
        <div class="exercise-name">Elevaciones laterales</div>
        <div class="exercise-desc">3 series x 12-15 reps</div>
      </div>
    </div>

    <div class="card">
      <h2>Pecho</h2>
      <div class="exercise">
        <div class="exercise-name">Press banca plano</div>
        <div class="exercise-desc">4 series x 8-10 reps</div>
      </div>
      <div class="exercise">
        <div class="exercise-name">Aperturas con mancuernas</div>
        <div class="exercise-desc">3 series x 12 reps</div>
      </div>
    </div>

    <div class="card">
      <h2>Bíceps</h2>
      <div class="exercise">
        <div class="exercise-name">Curl con barra</div>
        <div class="exercise-desc">3 series x 10 reps</div>
      </div>
      <div class="exercise">
        <div class="exercise-name">Curl martillo</div>
        <div class="exercise-desc">3 series x 12 reps</div>
      </div>
    </div>

    <button onclick="alert('✅ App funcionando!')">Guardar entrenamiento hoy</button>
  </div>
</div>

<nav>
  <div>
    <button class="active">🏋️ Ejercicios</button>
    <button>📅 Calendario</button>
    <button>🍎 Dieta</button>
    <button>👤 Perfil</button>
  </div>
</nav>

<script>
  console.log("✅ FitTrack cargado correctamente");
</script>
</body>
</html>
