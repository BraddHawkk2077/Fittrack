/* ---------------- ICONS (SVG livianos, sin dependencias) ---------------- */
function Icon({ name, size = 20, color = "#EDEBE6", strokeWidth = 2 }) {
  const p = { fill: "none", stroke: color, strokeWidth, strokeLinecap: "round", strokeLinejoin: "round" };
  const s = { width: size, height: size, viewBox: "0 0 24 24" };
  switch (name) {
    case "dumbbell": return <svg {...s}><path {...p} d="M4 9v6M2 10v4M20 10v4M22 9v6M7 9v6M17 9v6M7 12h10"/></svg>;
    case "calendar": return <svg {...s}><rect {...p} x="3" y="5" width="18" height="16" rx="2"/><path {...p} d="M3 10h18M8 3v4M16 3v4"/></svg>;
    case "apple": return <svg {...s}><path {...p} d="M12 8c-2.5-2-6-1-6 3.5C6 16 9 20 12 20s6-4 6-8.5c0-2.7-1.5-4-3-4"/><path {...p} d="M12 8V5c0-1 .8-2 2-2"/></svg>;
    case "user": return <svg {...s}><circle {...p} cx="12" cy="8" r="4"/><path {...p} d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>;
    case "chevronLeft": return <svg {...s}><path {...p} d="M15 5l-7 7 7 7"/></svg>;
    case "chevronRight": return <svg {...s}><path {...p} d="M9 5l7 7-7 7"/></svg>;
    case "x": return <svg {...s}><path {...p} d="M6 6l12 12M18 6L6 18"/></svg>;
    case "check": return <svg {...s}><path {...p} d="M5 12l5 5 9-10"/></svg>;
    case "wind": return <svg {...s}><path {...p} d="M3 8h11a2.5 2.5 0 1 0-2.5-3.5M3 13h15a2.5 2.5 0 1 1-2.5 3.5M3 18h9"/></svg>;
    case "moon": return <svg {...s}><path {...p} d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>;
    case "save": return <svg {...s}><rect {...p} x="4" y="4" width="16" height="16" rx="2"/><path {...p} d="M8 4v5h8V4M8 20v-6h8v6"/></svg>;
    case "trash": return <svg {...s}><path {...p} d="M5 7h14M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>;
    default: return null;

}

  perder_grasa: { label: "Reducir grasa corporal", adj: -0.2 },
  mantener: { label: "Mantener mi físico actual", adj: 0 },
  ganar_musculo: { label: "Ganar masa muscular", adj: 0.15 },
  rendimiento: { label: "Rendimiento deportivo (fútbol + gym)", adj: 0.05 },
};
const FOOD_IDEAS = {
  proteina: ["Pollo o pescado a la plancha", "Huevos", "Carne magra", "Yogur griego", "Legumbres (lentejas, garbanzos)"],
  carbohidrato: ["Arroz o quinoa", "Papa o batata", "Avena", "Pan integral", "Frutas"],

};

/* ---------------- HELPERS ---------------- */
function todayISO() { return new Date().toISOString().slice(0, 10); }
function fmtMonth(y, m) {
  const names = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  return `${names[m]} ${y}`;
}
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function firstWeekday(y, m) { return new Date(y, m, 1).getDay(); }
function calcDiet(profile) {
  const { weight, height, age, sex, activity, goal } = profile;
  if (!weight || !height || !age) return null;
  const w = parseFloat(weight), h = parseFloat(height), a = parseFloat(age);
  const bmr = 10 * w + 6.25 * h - 5 * a + (sex === "mujer" ? -161 : 5);
  const tdee = bmr * ACTIVITY_FACTORS[activity].f;
  const target = Math.round(tdee * (1 + GOALS[goal].adj));
  const proteinG = Math.round(w * (goal === "perder_grasa" || goal === "ganar_musculo" ? 2.1 : 1.8));
  const fatKcal = target * 0.27;
  const fatG = Math.round(fatKcal / 9);
  const carbsKcal = Math.max(target - proteinG * 4 - fatKcal, 0);
  const carbsG = Math.round(carbsKcal / 4);
  return { tdee: Math.round(tdee), target, proteinG, fatG, carbsG };
}

/* ---------------- STORAGE (localStorage, 100% offline) ---------------- */
function lsGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

/* ---------------- APP ---------------- */
function App() {
  const [tab, setTab] = useState("ejercicios");
  const [profile, setProfile] = useState(() => lsGet("profile", null));
  const [trainingLog, setTrainingLog] = useState(() => lsGet("training-log", {}));
  const [dietLog, setDietLog] = useState(() => lsGet("diet-log", {}));

  function saveProfile(p) { setProfile(p); lsSet("profile", p); }
  function saveTrainingLog(next) { setTrainingLog(next); lsSet("training-log", next); }
  function saveDietLog(next) { setDietLog(next); lsSet("diet-log", next); }

  return (
    <div style={{ background: COLORS.bg, minHeight: "100vh", fontFamily: FONT_BODY, color: COLORS.text, paddingBottom: 84 }}>
      <Header tab={tab} />
      <main style={{ maxWidth: 480, margin: "0 auto", padding: "0 16px" }}>
        {tab === "ejercicios" && <ExerciseTab trainingLog={trainingLog} saveTrainingLog={saveTrainingLog} />}
        {tab === "calendario" && <CalendarTab trainingLog={trainingLog} saveTrainingLog={saveTrainingLog} />}
        {tab === "dieta" && <DietTab profile={profile} dietLog={dietLog} saveDietLog={saveDietLog} />}
        {tab === "perfil" && <ProfileTab profile={profile} saveProfile={saveProfile} trainingLog={trainingLog} />}
      </main>
      <BottomNav tab={tab} setTab={setTab} />
    </div>
  );
}

      </div>
    </div>

}

function BottomNav({ tab, setTab }) {

    { id: "calendario", icon: "calendar", label: "Calendario" },

            </button>
          );
        })}
      </div>
    </nav>
  );
}

function ExerciseTab({ trainingLog, saveTrainingLog }) {
  const [mode, setMode] = useState("fuerza");
  const [view, setView] = useState("frente");
  const [selected, setSelected] = useState(null);
  const [picked, setPicked] = useState([]);
  const openMuscle = (key) => { setSelected(key); setPicked([]); };

  function addToday(type) {
    const date = todayISO();
    const existing = trainingLog[date] || { type, exercises: [], notes: "" };
    const merged = Array.from(new Set([...(existing.exercises || []), ...picked]));
    saveTrainingLog({ ...trainingLog, [date]: { ...existing, type, exercises: merged } });
    setSelected(null); setPicked([]);
  }

  return (
    <div style={{ paddingTop: 16 }}>
      <SegmentedControl options={[{ id: "fuerza", label: "Fuerza" }, { id: "recuperacion", label: "Estiramiento y descanso" }]} value={mode} onChange={setMode} />
      {mode === "fuerza" && (
        <>
          <div style={{ display: "flex", justifyContent: "center", gap: 8, margin: "18px 0 4px" }}>
            <ToggleChip label="Frente" active={view === "frente"} onClick={() => setView("frente")} />
            <ToggleChip label="Espalda" active={view === "espalda"} onClick={() => setView("espalda")} />
          </div>
          <BodyMap view={view} onSelect={openMuscle} />
          <p style={{ textAlign: "center", color: COLORS.muted, fontSize: 12, marginTop: 4 }}>Tocá una zona del cuerpo para ver sus ejercicios</p>
        </>
      )}
      {mode === "recuperacion" && (
        <div style={{ marginTop: 18, display: "flex", flexDirection: "column", gap: 20 }}>
          <ExerciseListCard icon="wind" color={COLORS.blue} title="Estiramiento y movilidad" items={STRETCH} />
          <ExerciseListCard icon="moon" color={COLORS.blue} title="Descanso y relajación" items={RECOVERY} />
        </div>
      )}
      {selected && <MuscleSheet muscleKey={selected} picked={picked} setPicked={setPicked} onClose={() => { setSelected(null); setPicked([]); }} onSave={addToday} />}
    </div>
  );
}

function SegmentedControl({ options, value, onChange }) {
  return (
    <div style={{ display: "flex", background: COLORS.surface, borderRadius: 12, padding: 4, gap: 4 }}>
      {options.map((o) => {
        const active = value === o.id;
        return <button key={o.id} onClick={() => onChange(o.id)} style={{ flex: 1, padding: "9px 6px", borderRadius: 9, border: "none", cursor: "pointer", background: active ? COLORS.green : "transparent", color: active ? "#12160F" : COLORS.muted, fontWeight: 600, fontSize: 13 }}>{o.label}</button>;
      })}
    </div>
  );
}

function ToggleChip({ label, active, onClick }) {
  return <button onClick={onClick} style={{ padding: "6px 16px", borderRadius: 999, cursor: "pointer", border: `1px solid ${active ? COLORS.amber : COLORS.line}`, background: active ? "rgba(232,179,61,0.12)" : "transparent", color: active ? COLORS.amber : COLORS.muted, fontSize: 13, fontWeight: 600 }}>{label}</button>;

function MuscleSheet({ muscleKey, picked, setPicked, onClose, onSave }) {
  const group = MUSCLES[muscleKey];
  const toggle = (name) => setPicked((p) => p.includes(name) ? p.filter((x) => x !== name) : [...p, name]);
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.55)", zIndex: 30, display: "flex", alignItems: "flex-end" }} onClick={onClose}>
      <div style={{ background: COLORS.surface, width: "100%", maxWidth: 480, margin: "0 auto", borderRadius: "20px 20px 0 0", padding: 20, maxHeight: "78vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <span style={{ fontFamily: FONT_DISPLAY, fontSize: 20, fontWeight: 600 }}>{group.label}</span>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer" }}><Icon name="x" size={22} color={COLORS.muted} /></button>
        </div>
        {group.exercises.map((ex, i) => {
          const active = picked.includes(ex.n);
          return (
            <button key={i} onClick={() => toggle(ex.n)} style={{ width: "100%", textAlign: "left", background: active ? "rgba(124,179,66,0.12)" : "transparent", border: `1px solid ${active ? COLORS.green : COLORS.line}`, borderRadius: 12, padding: "12px 14px", marginBottom: 8, cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div><div style={{ fontSize: 14, fontWeight: 500 }}>{ex.n}</div><div style={{ fontSize: 12, color: COLORS.muted }}>{ex.d}</div></div>
              {active && <Icon name="check" size={18} color={COLORS.green} />}
            </button>
          );
        })}
        {picked.length > 0 && (
          <div style={{ marginTop: 14, display: "flex", gap: 8 }}>
            <button onClick={() => onSave("Gimnasio")} style={btnPrimary}>+ Gimnasio hoy</button>
            <button onClick={() => onSave("Fútbol")} style={btnSecondary}>+ Fútbol hoy</button>
          </div>
        )}
      </div>
    </div>
  );
}

const btnPrimary = { flex: 1, background: COLORS.green, color: "#12160F", border: "none", borderRadius: 12, padding: "12px 0", fontWeight: 700, fontSize: 13, cursor: "pointer" };
const btnSecondary = { flex: 1, background: "transparent", color: COLORS.amber, border: `1px solid ${COLORS.amber}`, borderRadius: 12, padding: "12px 0", fontWeight: 700, fontSize: 13, cursor: "pointer" };

function CalendarTab({ trainingLog, saveTrainingLog }) {
  const now = new Date();
  const [y, setY] = useState(now.getFullYear());
  const [m, setM] = useState(now.getMonth());
  const [openDate, setOpenDate] = useState(null);
  const total = daysInMonth(y, m);
  const startDay = firstWeekday(y, m);
  const cells = [...Array(startDay).fill(null), ...Array(total).fill(0).map((_, i) => i + 1)];
  function shift(delta) { let nm = m + delta, ny = y; if (nm < 0) { nm = 11; ny -= 1; } if (nm > 11) { nm = 0; ny += 1; } setM(nm); setY(ny); }
  const typeColor = { "Gimnasio": COLORS.green, "Fútbol": COLORS.amber, "Descanso": COLORS.blue, "Otro": COLORS.muted };
  return (
    <div style={{ paddingTop: 16 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
        <button onClick={() => shift(-1)} style={iconBtn}><Icon name="chevronLeft" size={20} color={COLORS.text} /></button>
        <span style={{ fontFamily: FONT_DISPLAY, fontSize: 17, fontWeight: 600 }}>{fmtMonth(y, m)}</span>
        <button onClick={() => shift(1)} style={iconBtn}><Icon name="chevronRight" size={20} color={COLORS.text} /></button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4, marginBottom: 6 }}>
        {["D","L","M","M","J","V","S"].map((d, i) => <div key={i} style={{ textAlign: "center", fontSize: 11, color: COLORS.muted }}>{d}</div>)}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4 }}>
        {cells.map((day, i) => {
          if (!day) return <div key={i} />;
          const iso = `${y}-${String(m + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          const entry = trainingLog[iso];
          const isToday = iso === todayISO();
          return (
            <button key={i} onClick={() => setOpenDate(iso)} style={{ aspectRatio: "1", borderRadius: 10, border: isToday ? `1px solid ${COLORS.amber}` : `1px solid ${COLORS.line}`, background: COLORS.surface, cursor: "pointer", position: "relative", color: COLORS.text, fontSize: 13 }}>
              {day}
              {entry && <span style={{ position: "absolute", bottom: 4, left: "50%", transform: "translateX(-50%)", width: 5, height: 5, borderRadius: 999, background: typeColor[entry.type] || COLORS.muted }} />}
            </button>
          );
        })}
      </div>
      <div style={{ display: "flex", gap: 14, marginTop: 16, flexWrap: "wrap" }}>
        {Object.entries(typeColor).map(([k, c]) => (
          <div key={k} style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: 999, background: c }} /><span style={{ fontSize: 12, color: COLORS.muted }}>{k}</span></div>
        ))}
      </div>
      {openDate && (
        <DaySheet date={openDate} entry={trainingLog[openDate]} onClose={() => setOpenDate(null)}
          onSave={(data) => { saveTrainingLog({ ...trainingLog, [openDate]: data }); setOpenDate(null); }}
          onDelete={() => { const next = { ...trainingLog }; delete next[openDate]; saveTrainingLog(next); setOpenDate(null); }} />
      )}
    </div>
  );
}

const iconBtn = { background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 8, cursor: "pointer" };

function DaySheet({ date, entry, onClose, onSave, onDelete }) {
  const [type, setType] = useState(entry?.type || "Gimnasio");
  const [exercisesText, setExercisesText] = useState((entry?.exercises || []).join(", "));
  const [notes, setNotes] = useState(entry?.notes || "");
  function save() { onSave({ type, exercises: exercisesText.split(",").map((s) => s.trim()).filter(Boolean), notes }); }
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.55)", zIndex: 30, display: "flex", alignItems: "flex-end" }} onClick={onClose}>
      <div style={{ background: COLORS.surface, width: "100%", maxWidth: 480, margin: "0 auto", borderRadius: "20px 20px 0 0", padding: 20, maxHeight: "82vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <span style={{ fontFamily: FONT_DISPLAY, fontSize: 18, fontWeight: 600 }}>{date}</span>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer" }}><Icon name="x" size={22} color={COLORS.muted} /></button>
        </div>
        <label style={labelStyle}>Tipo de actividad</label>
        <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
          {["Gimnasio", "Fútbol", "Descanso", "Otro"].map((t) => <ToggleChip key={t} label={t} active={type === t} onClick={() => setType(t)} />)}
        </div>
        <label style={labelStyle}>Ejercicios (separados por coma)</label>
        <textarea value={exercisesText} onChange={(e) => setExercisesText(e.target.value)} rows={3} style={inputStyle} placeholder="Ej: Sentadilla, Press banca, Dominadas" />
        <label style={labelStyle}>Notas</label>
        <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={2} style={inputStyle} placeholder="Cómo te sentiste, peso usado, etc." />
        <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
          <button onClick={save} style={btnPrimary}>Guardar</button>
          {entry && <button onClick={onDelete} style={{ ...btnSecondary, color: "#E06767", borderColor: "#E06767", flex: "none", width: 46 }}><Icon name="trash" size={16} color="#E06767" /></button>}
        </div>
      </div>
    </div>
  );
}

const labelStyle = { fontSize: 12, color: COLORS.muted, marginBottom: 6, display: "block", fontWeight: 600 };
const inputStyle = { width: "100%", background: COLORS.surfaceAlt, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "10px 12px", color: COLORS.text, fontSize: 14, marginBottom: 14, fontFamily: FONT_BODY, resize: "none" };

function DietTab({ profile, dietLog, saveDietLog }) {
  const diet = useMemo(() => profile ? calcDiet(profile) : null, [profile]);
  const date = todayISO();
  const [morning, setMorning] = useState(dietLog[date]?.morning || "");
  const [afternoon, setAfternoon] = useState(dietLog[date]?.afternoon || "");
  const [night, setNight] = useState(dietLog[date]?.night || "");
  function saveMeals() { saveDietLog({ ...dietLog, [date]: { morning, afternoon, night } }); }
  if (!profile) {
    return (
      <div style={{ paddingTop: 40, textAlign: "center" }}>
        <Icon name="apple" size={32} color={COLORS.muted} />
        <p style={{ color: COLORS.muted, fontSize: 14, marginTop: 10, lineHeight: 1.5 }}>Completá tu perfil (peso, altura, edad y objetivo) en la pestaña <strong style={{ color: COLORS.text }}>Perfil</strong> para calcular tu plan de nutrición.</p>
      </div>
    );
  }
  return (
    <div style={{ paddingTop: 16 }}>
      <div style={{ background: COLORS.surface, borderRadius: 16, padding: 18, marginBottom: 18 }}>
        <div style={{ fontFamily: FONT_DISPLAY, fontSize: 15, color: COLORS.muted, letterSpacing: 1 }}>OBJETIVO DIARIO</div>
        <div style={{ fontFamily: FONT_DISPLAY, fontSize: 34, fontWeight: 700, color: COLORS.amber }}>{diet.target} kcal</div>
        <div style={{ display: "flex", gap: 18, marginTop: 12 }}>
          <MacroPill label="Proteína" value={`${diet.proteinG} g`} color={COLORS.green} />
          <MacroPill label="Carbos" value={`${diet.carbsG} g`} color={COLORS.blue} />
          <MacroPill label="Grasas" value={`${diet.fatG} g`} color={COLORS.amber} />
        </div>
      </div>
      <div style={{ fontFamily: FONT_DISPLAY, fontSize: 15, marginBottom: 8 }}>Ideas de alimentos</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
        <FoodRow label="Proteína" items={FOOD_IDEAS.proteina} color={COLORS.green} />
        <FoodRow label="Carbohidratos" items={FOOD_IDEAS.carbohidrato} color={COLORS.blue} />
        <FoodRow label="Grasas" items={FOOD_IDEAS.grasa} color={COLORS.amber} />
      </div>
      <div style={{ fontFamily: FONT_DISPLAY, fontSize: 15, marginBottom: 8 }}>Registro de hoy</div>
      <label style={labelStyle}>Mañana</label>
      <textarea value={morning} onChange={(e) => setMorning(e.target.value)} rows={2} style={inputStyle} placeholder="¿Qué comiste?" />
      <label style={labelStyle}>Tarde</label>
      <textarea value={afternoon} onChange={(e) => setAfternoon(e.target.value)} rows={2} style={inputStyle} placeholder="¿Qué comiste?" />
      <label style={labelStyle}>Noche</label>
      <textarea value={night} onChange={(e) => setNight(e.target.value)} rows={2} style={inputStyle} placeholder="¿Qué comiste?" />
      <button onClick={saveMeals} style={{ ...btnPrimary, width: "100%" }}>Guardar registro de hoy</button>
      <p style={{ fontSize: 11, color: COLORS.muted, marginTop: 14, lineHeight: 1.5 }}>Estimación calculada con la fórmula Mifflin-St Jeor. Es una guía general, no reemplaza a un nutricionista.</p>
    </div>
  );
}

function MacroPill({ label, value, color }) {
  return <div><div style={{ fontSize: 11, color: COLORS.muted }}>{label}</div><div style={{ fontSize: 15, fontWeight: 700, color }}>{value}</div></div>;
}
function FoodRow({ label, items, color }) {
  return <div style={{ background: COLORS.surface, borderRadius: 12, padding: 12 }}><div style={{ fontSize: 12, fontWeight: 700, color, marginBottom: 6 }}>{label}</div><div style={{ fontSize: 13, color: COLORS.text, lineHeight: 1.6 }}>{items.join(" · ")}</div></div>;
}

function ProfileTab({ profile, saveProfile, trainingLog }) {
  const [form, setForm] = useState(profile || { weight: "", height: "", age: "", sex: "hombre", activity: "moderado", goal: "mantener", build: "medio" });
  const [saved, setSaved] = useState(false);
  const monthCount = useMemo(() => {
    const now = todayISO().slice(0, 7);
    return Object.keys(trainingLog).filter((d) => d.startsWith(now) && trainingLog[d].type !== "Descanso").length;
  }, [trainingLog]);
  function update(k, v) { setForm((f) => ({ ...f, [k]: v })); setSaved(false); }
  function submit() { saveProfile(form); setSaved(true); }
  return (
    <div style={{ paddingTop: 16 }}>
      <div style={{ background: COLORS.surface, borderRadius: 16, padding: 16, marginBottom: 18, display: "flex", justifyContent: "space-around", textAlign: "center" }}>
        <div><div style={{ fontFamily: FONT_DISPLAY, fontSize: 26, fontWeight: 700, color: COLORS.green }}>{monthCount}</div><div style={{ fontSize: 11, color: COLORS.muted }}>días activos este mes</div></div>
      </div>
      <label style={labelStyle}>Peso (kg)</label>
      <input type="number" value={form.weight} onChange={(e) => update("weight", e.target.value)} style={inputStyle} placeholder="Ej: 72" />
      <label style={labelStyle}>Altura (cm)</label>
      <input type="number" value={form.height} onChange={(e) => update("height", e.target.value)} style={inputStyle} placeholder="Ej: 178" />
      <label style={labelStyle}>Edad</label>
      <input type="number" value={form.age} onChange={(e) => update("age", e.target.value)} style={inputStyle} placeholder="Ej: 24" />
      <label style={labelStyle}>Sexo</label>
      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        {[{ id: "hombre", l: "Hombre" }, { id: "mujer", l: "Mujer" }].map((o) => <ToggleChip key={o.id} label={o.l} active={form.sex === o.id} onClick={() => update("sex", o.id)} />)}
      </div>
      <label style={labelStyle}>Contextura</label>
      <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
        {[{ id: "delgado", l: "Delgada" }, { id: "medio", l: "Media" }, { id: "robusto", l: "Robusta" }].map((o) => <ToggleChip key={o.id} label={o.l} active={form.build === o.id} onClick={() => update("build", o.id)} />)}
      </div>
      <label style={labelStyle}>Nivel de actividad</label>
      <select value={form.activity} onChange={(e) => update("activity", e.target.value)} style={{ ...inputStyle, appearance: "none" }}>
        {Object.entries(ACTIVITY_FACTORS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
      </select>
      <label style={labelStyle}>Objetivo físico</label>
      <select value={form.goal} onChange={(e) => update("goal", e.target.value)} style={{ ...inputStyle, appearance: "none" }}>
        {Object.entries(GOALS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
      </select>
      <button onClick={submit} disabled={!form.weight || !form.height || !form.age} style={{ ...btnPrimary, width: "100%", opacity: (!form.weight || !form.height || !form.age) ? 0.5 : 1 }}>{saved ? "Guardado ✓" : "Guardar perfil"}</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
